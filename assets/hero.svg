<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">P. B. Belleppa — ECE engineer, silicon to software</title>
  <desc id="d">Flat dark banner with a chip labelled BELLEPPA-01, amber signal traces, and the name P. B. Belleppa.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#161B20" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .pulse { fill: none; stroke: #ffb020; stroke-width: 2.4; stroke-dasharray: 5 240; animation: flow 3.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -245; } }
    .blink { animation: blink 2.4s ease-in-out infinite; }
    @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
    .scan { animation: scan 7s ease-in-out infinite; }
    @keyframes scan { 0%,100% { transform: translateY(0) } 50% { transform: translateY(16px) } }
  </style>

  <rect width="1200" height="400" rx="16" fill="#0c0e11"/>
  <rect width="1200" height="400" rx="16" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="398" rx="15" fill="none" stroke="#262e36" stroke-width="1.6"/>

  <text x="1180" y="382" text-anchor="end" class="sans" font-size="230" font-weight="800" fill="#12171c">01</text>

  <!-- traces -->
  <g fill="none" stroke="#262e36" stroke-width="2">
    <path d="M92 145H62V84H20"/>
    <path d="M92 171H46V38H20"/>
    <path d="M92 197H72V197H20"/>
    <path d="M92 223H54V300H20"/>
    <path d="M92 249H66V352H20"/>
    <path d="M92 275H60V384H20"/>
    <path d="M92 301H74V400"/>
    <path d="M308 145H366V92H455"/>
    <path d="M308 171H392V58H455"/>
    <path d="M308 197H420V150H455"/>
    <path d="M308 223H448"/>
    <path d="M308 249H420V330H455"/>
    <path d="M308 275H392V376H455"/>
    <path d="M308 301H366V400"/>
  </g>
  <g>
    <path class="pulse" d="M92 145H62V84H20"/>
    <path class="pulse" style="animation-delay:-1.2s" d="M92 197H20"/>
    <path class="pulse" style="animation-delay:-2.1s" d="M92 275H60V384H20"/>
    <path class="pulse" style="animation-delay:-.7s" d="M308 171H392V58H455"/>
    <path class="pulse" style="animation-delay:-1.8s" d="M308 223H448"/>
    <path class="pulse" style="animation-delay:-2.7s" d="M308 275H392V376H455"/>
  </g>
  <g fill="#ffb020">
    <rect x="452" y="89" width="6" height="6"/>
    <rect x="452" y="147" width="6" height="6"/>
    <rect x="445" y="220" width="6" height="6"/>
    <rect x="452" y="373" width="6" height="6"/>
    <rect x="17" y="81" width="6" height="6"/>
    <rect x="17" y="297" width="6" height="6"/>
    <rect x="17" y="381" width="6" height="6"/>
  </g>

  <!-- pins -->
  <g fill="#ffb020">
    <rect x="92" y="138" width="18" height="14" rx="1.5"/>
    <rect x="92" y="164" width="18" height="14" rx="1.5"/>
    <rect x="92" y="190" width="18" height="14" rx="1.5"/>
    <rect x="92" y="216" width="18" height="14" rx="1.5"/>
    <rect x="92" y="242" width="18" height="14" rx="1.5"/>
    <rect x="92" y="268" width="18" height="14" rx="1.5"/>
    <rect x="92" y="294" width="18" height="14" rx="1.5"/>
    <rect x="290" y="138" width="18" height="14" rx="1.5"/>
    <rect x="290" y="164" width="18" height="14" rx="1.5"/>
    <rect x="290" y="190" width="18" height="14" rx="1.5"/>
    <rect x="290" y="216" width="18" height="14" rx="1.5"/>
    <rect x="290" y="242" width="18" height="14" rx="1.5"/>
    <rect x="290" y="268" width="18" height="14" rx="1.5"/>
    <rect x="290" y="294" width="18" height="14" rx="1.5"/>
  </g>

  <!-- chip -->
  <rect x="110" y="120" width="180" height="200" rx="10" fill="#151a20" stroke="#3a434d" stroke-width="1.6"/>
  <circle cx="200" cy="150" r="3" fill="#0c0e11" stroke="#3a434d"/>
  <text x="200" y="214" text-anchor="middle" class="sans" font-size="40" font-weight="800" fill="#f4f1e8" letter-spacing="2">PBB</text>
  <text x="200" y="236" text-anchor="middle" class="mono" font-size="10" fill="#ffb020" letter-spacing="3">BELLEPPA-01</text>
  <text x="200" y="272" text-anchor="middle" class="mono" font-size="9" fill="#6f787f" letter-spacing="2">ECE SoC</text>
  <rect class="scan" x="110" y="120" width="180" height="2" fill="#ffb020" opacity=".35"/>
  <rect x="110" y="120" width="180" height="3" fill="#ffb020"/>

  <text x="470" y="132" class="mono" font-size="12" fill="#8b939c" letter-spacing="3">BELLEPPA-01 · BENGALURU, IN</text>
  <text x="468" y="200" class="sans" font-size="64" font-weight="800" fill="#f4f1e8" letter-spacing="1">P. B. BELLEPPA</text>
  <text x="471" y="240" class="mono" font-size="16" fill="#ffb020" letter-spacing="3.2">ECE ENGINEER · SILICON → SOFTWARE</text>
  <text x="471" y="272" class="sans" font-size="15" fill="#8b939c">Final-year Electronics &amp; Communication</text>

  <rect x="471" y="304" width="8" height="8" fill="#ffb020" class="blink"/>
  <text x="491" y="313" class="mono" font-size="12.5" fill="#f4f1e8" letter-spacing="2">OPEN TO INTERNSHIPS &amp; ENTRY-LEVEL ROLES</text>
</svg>
