<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Boot sequence</title>
  <desc id="d">A terminal powering on: C, C++, Python, digital logic, VLSI and embedded systems loaded, ending with build, break, measure, ship.</desc>
  <style>
    .line { opacity: 0; animation: show .01s linear forwards; }
    @keyframes show { to { opacity: 1 } }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .cursor { animation: cursor 1.1s steps(1) infinite; }
    @keyframes cursor { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .line, .cursor { opacity: 1; animation: none; }
    }
  </style>

  <rect width="1200" height="300" rx="14" fill="#0c0e11"/>
  <rect x="1" y="1" width="1198" height="298" rx="13" fill="none" stroke="#262e36" stroke-width="1.6"/>
  <path d="M0 46h1200" stroke="#262e36"/>
  <rect width="1200" height="46" rx="14" fill="#14181d"/>
  <rect y="32" width="1200" height="14" fill="#14181d"/>

  <circle cx="30" cy="23" r="5" fill="#3a434d"/>
  <circle cx="48" cy="23" r="5" fill="#3a434d"/>
  <circle cx="66" cy="23" r="5" fill="#ffb020"/>
  <text x="600" y="27" text-anchor="middle" class="mono" font-size="11.5" fill="#6f787f" letter-spacing="1.2">belleppa@dev — boot</text>

  <g class="mono" font-size="15.5" fill="#c9c6bd" xml:space="preserve">
    <text x="40" y="88" class="line" style="animation-delay:.1s">
      <tspan fill="#ffb020">$</tspan><tspan fill="#f4f1e8"> ./boot --profile belleppa</tspan>
    </text>
    <text x="40" y="126" class="line" style="animation-delay:.8s">
      <tspan fill="#ffb020">[ ok ]</tspan><tspan> c · c++ · python</tspan>
    </text>
    <text x="40" y="158" class="line" style="animation-delay:1.4s">
      <tspan fill="#ffb020">[ ok ]</tspan><tspan> digital logic · vlsi</tspan>
    </text>
    <text x="40" y="190" class="line" style="animation-delay:2.0s">
      <tspan fill="#ffb020">[ ok ]</tspan><tspan> embedded · arduino</tspan>
    </text>
    <text x="40" y="226" class="line" style="animation-delay:2.6s">
      <tspan fill="#ffb020">[ go ]</tspan><tspan fill="#f4f1e8"> build → break → measure → ship</tspan>
    </text>
  </g>

  <g class="line" style="animation-delay:3.1s">
    <text x="40" y="268" class="mono" font-size="15.5" fill="#ffb020">$</text>
    <rect class="cursor" x="58" y="255" width="9" height="16" fill="#ffb020"/>
  </g>
</svg>
